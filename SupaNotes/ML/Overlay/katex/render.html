<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="katex.min.css">
<script src="katex.min.js"></script>
<style>
  body { margin: 0; padding: 0; background: transparent; }
  #container {
    display: inline-block;
    padding: 12px 16px;
    white-space: nowrap;
    position: relative;
  }
</style>
</head>
<body>
<div id="container"></div>
<script>
function collectLeafRects(root, cr) {
  var results = [];
  function walk(node) {
    if (node.nodeType === 3) {
      var text = node.textContent.trim();
      if (text.length > 0) {
        var range = document.createRange();
        range.selectNodeContents(node);
        var rects = range.getClientRects();
        for (var i = 0; i < rects.length; i++) {
          results.push({
            text: text,
            x: rects[i].left - cr.left,
            y: rects[i].top - cr.top,
            width: rects[i].width,
            height: rects[i].height
          });
        }
      }
      return;
    }
    if (node.nodeType !== 1) return;
    if (node.classList && node.classList.contains('katex-mathml')) return;
    // Fraction line
    if (node.classList && node.classList.contains('frac-line')) {
      var br = node.getBoundingClientRect();
      if (br.width > 0) {
        results.push({
          text: '\u2014',
          x: br.left - cr.left,
          y: br.top - cr.top,
          width: br.width,
          height: Math.max(br.height, 2)
        });
      }
    }
    // Sized delimiters (parentheses, brackets around matrices)
    if (node.classList && node.classList.contains('delimsizing')) {
      var br = node.getBoundingClientRect();
      if (br.width > 0 && br.height > 0) {
        var delText = node.textContent.trim() || '(';
        results.push({
          text: delText,
          x: br.left - cr.left,
          y: br.top - cr.top,
          width: br.width,
          height: br.height
        });
        return; // don't recurse into delimiter children
      }
    }
    for (var i = 0; i < node.childNodes.length; i++) {
      walk(node.childNodes[i]);
    }
  }
  walk(root);
  return results;
}

var debugColors = ['#FF0000','#0000FF','#00AA00','#FF8800','#AA00AA','#FF00AA','#00AAAA','#AAAA00'];

function renderLatex(latex, fontSize, drawDebug) {
  var el = document.getElementById('container');
  el.style.fontSize = fontSize + 'px';
  // Remove old debug overlays
  var old = el.querySelectorAll('.debug-box');
  for (var i = 0; i < old.length; i++) old[i].remove();

  try {
    katex.render(latex, el, {
      throwOnError: false,
      trust: true,
      output: 'html',
      displayMode: false
    });
  } catch(e) {
    el.textContent = latex;
  }
  var r = el.getBoundingClientRect();
  var katexHtml = el.querySelector('.katex-html') || el;
  var leaves = collectLeafRects(katexHtml, r);
  var pad = 8;

  // Draw debug boxes directly into the DOM
  if (drawDebug) {
    for (var i = 0; i < leaves.length; i++) {
      var lr = leaves[i];
      var box = document.createElement('div');
      box.className = 'debug-box';
      box.style.position = 'absolute';
      box.style.left = lr.x + 'px';
      box.style.top = lr.y + 'px';
      box.style.width = lr.width + 'px';
      box.style.height = lr.height + 'px';
      box.style.border = '2px solid ' + debugColors[i % debugColors.length];
      box.style.pointerEvents = 'none';
      box.style.boxSizing = 'border-box';
      el.appendChild(box);
    }
    // Recalculate container size after adding boxes
    r = el.getBoundingClientRect();
  }

  return JSON.stringify({
    width: Math.ceil(r.width) + pad * 2,
    height: Math.ceil(r.height) + pad * 2,
    leafRects: leaves.map(function(lr) {
      return {
        text: lr.text,
        x: lr.x + pad,
        y: lr.y + pad,
        width: lr.width,
        height: lr.height
      };
    })
  });
}
</script>
</body>
</html>
